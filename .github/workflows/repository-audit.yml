name: Repository audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen analysis artifacts (unchanged since the benchmark run)
        run: |
          git diff --exit-code f97a5536208115e26de9576339d16e72c130d24f -- \
            notebooks \
            data/splits \
            results/reference \
            tables/reference \
            figures/reference \
            scripts/download_data.py \
            scripts/run_notebooks.py \
            requirements.txt \
            environment.yml \
            docs/DATASET.md \
            docs/REPRODUCIBILITY.md \
            docs/NOTEBOOK_MAP.md

      - name: Verify release metadata
        run: |
          test -f LICENSE
          grep -Fq 'MIT License' LICENSE
          test -f CITATION.cff
          grep -Fq 'version: "1.0.0"' CITATION.cff
          grep -Fq 'Coronel-Reyes' CITATION.cff
          grep -Fq 'Carvajal Romero' CITATION.cff
          grep -Fq 'Haro-Sarango' CITATION.cff

      - name: Install analysis dependencies
        run: pip install "numpy>=2.0,<2.3" "pandas>=2.2,<2.4" "matplotlib>=3.8"

      - name: Recompute primary contrasts from the frozen OOF predictions
        run: |
          cp manuscript/tables/primary_contrasts_holm_bonferroni.csv /tmp/expected.csv
          cd manuscript/scripts && python primary_contrasts.py
          cd ../.. && python - <<'PY'
          import pandas as pd
          a = pd.read_csv("/tmp/expected.csv"); b = pd.read_csv("manuscript/tables/primary_contrasts_holm_bonferroni.csv")
          num = a.select_dtypes("number").columns
          assert ((a[num] - b[num]).abs() < 1e-9).all().all(), "primary contrasts differ from the committed table"
          print("primary contrasts reproduced exactly")
          PY

      - name: Run static reproducibility audit
        run: python scripts/verify_repository.py
